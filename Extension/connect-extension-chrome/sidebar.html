<!DOCTYPE html>
<html lang="en" data-beasties-container>
<head>
  <meta charset="utf-8">
  <title>Connect Extension App</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="styles-UW7NY5TW.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* Styles personnalisés pour garantir la taille correcte des icônes */
    .material-icons.text-xs {
      font-size: 12px !important;
      width: 12px !important;
      height: 12px !important;
    }
    .material-icons.text-sm {
      font-size: 14px !important;
      width: 14px !important;
      height: 14px !important;
    }
    /* Styles pour les boutons d'action */
    button.w-6 {
      width: 24px !important;
      height: 24px !important;
    }
    
    /* Styles pour l'extension en pleine hauteur */
    html, body {
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: auto !important; /* Permettre le défilement */
    }
    
    body {
      display: flex !important;
      flex-direction: column !important;
      min-height: 100vh !important;
      padding-right: 6px !important; /* Espace pour la barre de défilement */
    }
    
    app-root {
      display: flex !important;
      flex-direction: column !important;
      flex: 1 !important;
      min-height: 100vh !important;
    }
    
    /* Styles pour la barre de défilement */
    ::-webkit-scrollbar {
      width: 8px !important;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f1f1 !important;
      border-radius: 10px !important;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #888 !important;
      border-radius: 10px !important;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #555 !important;
    }
    
    /* Ajouter de l'espace à droite pour la barre de défilement */
    .container {
      padding-right: 1.5rem !important;
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <script src="polyfills-FFHMD2TL.js" type="module"></script>
  <script src="main-RPIWR5CT.js" type="module"></script>
</body>
</html>
