<div *ngIf="isOpen" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
  <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
    <div class="mt-3 text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-blue-100">
        <span class="material-icons text-blue-600">info</span>
      </div>
      <h3 class="text-lg leading-6 font-medium text-gray-900 mt-4">LinkedIn Login Required</h3>
      <div class="mt-2 px-7 py-3">
        <p class="text-sm text-gray-500">
          Please login with LinkedIn to connect with availabilities and view their profiles.
        </p>
      </div>
      <div class="items-center px-4 py-3">
        <button
          (click)="loginWithLinkedIn()"
          class="px-4 py-2 bg-blue-600 text-white text-base font-medium rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          Login with LinkedIn
        </button>
        <button
          (click)="close()"
          class="mt-3 px-4 py-2 bg-gray-100 text-gray-700 text-base font-medium rounded-md shadow-sm hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-gray-400 ml-2"
        >
          Close
        </button>
      </div>
    </div>
  </div>
  
  <!-- Loading Screen -->
  <app-loading-screen [isOpen]="showLoading"></app-loading-screen>
  
  <!-- Confirmation Modal -->
  <app-linkedin-confirmation
    [isOpen]="showConfirmation"
    [userData]="userData"
    (closeModal)="close()"
    (confirm)="handleConfirm($event)"
  ></app-linkedin-confirmation>
</div>
